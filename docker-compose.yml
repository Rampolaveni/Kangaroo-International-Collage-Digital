services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    ports:
      - "8000:8000"
    volumes:
      - static_files:/app/staticfiles

  frontend:
    build: ./frontend
    ports:
      - "80:80"

volumes:
  static_files: